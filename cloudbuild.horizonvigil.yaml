substitutions:
  _REGION: us-central1
  _SERVICE: prowler-runner
  _IMAGE: prowler-runner
steps:
- name: gcr.io/cloud-builders/docker
  args:
  - build
  - -f
  - horizonvigil_runner/Dockerfile
  - -t
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/horizonvigil-images/${_IMAGE}:$BUILD_ID
  - .
- name: gcr.io/cloud-builders/docker
  args:
  - push
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/horizonvigil-images/${_IMAGE}:$BUILD_ID
- name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
  entrypoint: gcloud
  args:
  - run
  - deploy
  - ${_SERVICE}
  - --project=$PROJECT_ID
  - --region=${_REGION}
  - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/horizonvigil-images/${_IMAGE}:$BUILD_ID
  - --platform=managed
  - --no-allow-unauthenticated
  - --update-secrets=INTERNAL_SCAN_SECRET=PROWLER_RUNNER_SECRET:latest
  - --update-env-vars=PROWLER_SCAN_TIMEOUT_SECONDS=900
images:
- ${_REGION}-docker.pkg.dev/$PROJECT_ID/horizonvigil-images/${_IMAGE}:$BUILD_ID
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
